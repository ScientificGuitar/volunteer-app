services:
  db:
    image: postgres:17-alpine
    container_name: rosterly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rosterly
      POSTGRES_PASSWORD: rosterly
      POSTGRES_DB: rosterly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosterly"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./RosterlyApi
      dockerfile: Dockerfile
    container_name: rosterly-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Database=rosterly;Username=rosterly;Password=rosterly"
      Clerk__Issuer: "${CLERK_ISSUER}"
      Clerk__AuthorizedParties: "${CLERK_AUTHORIZED_PARTIES}"
      Cors__Origins: "${CORS_ORIGINS}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY}"
    container_name: rosterly-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
