services:
  db:
    image: postgres:17-alpine
    container_name: rosterly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rosterly
      POSTGRES_PASSWORD: rosterly
      POSTGRES_DB: rosterly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosterly"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./RosterlyApi
      dockerfile: Dockerfile
    container_name: rosterly-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Database=rosterly;Username=rosterly;Password=rosterly"
      Clerk__Issuer: "${CLERK_ISSUER}"
      Clerk__AuthorizedParties: "${CLERK_AUTHORIZED_PARTIES}"
      Cors__Origins: "${CORS_ORIGINS}"
      Resend__ApiKey: "${RESEND_API_KEY}"
      Email__FromEmail: "${EMAIL_FROM_EMAIL}"
      Email__FromName: "${EMAIL_FROM_NAME:-Rosterly}"
      Email__BaseUrl: "${EMAIL_BASE_URL}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY}"
    container_name: rosterly-client
    restart: unless-stopped
    # Uncomment for local debug without Cloudflare:
    # ports:
    #   - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rosterly-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      frontend:
        condition: service_started

volumes:
  pgdata:
